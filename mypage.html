<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにまち</title>
    <link rel="stylesheet" href="css/mypage.css">
    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/mypage.js"></script>
</head>

<body>
    <div class="main_content">
        <header>
            <div class="header_icons">
                <a href="mypage.html" class="icon_img">
                    <p><img src="images/mypage_icon.svg" alt="マイページに飛ぶアイコン"></p>
                </a>
                <a href="qrpage.html" class="qr_link">
                    <p><img src="images/qr_icon.svg" alt="QRコードを読み込むアイコン"></p>
                </a>
            </div>
        </header>

        <main class="mypage">
            <h1>マイページ</h1>
            <div class="mypage_form">
                <div class="mypage_row">
                    <label for="userName">名前</label>
                    <div class="name_input_wrap">
                        <div class="input_icon_wrap">
                            <input type="text" id="userName" value="あまね">
                            <button type="button" class="edit_button">
                                <img src="images/edit.svg" alt="名前を編集">
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mypage_row">
                    <label for="language">言語</label>
                    <div class="language_input_wrap">
                        <div class="input_icon_wrap">
                            <img src="images/lang.svg" alt="言語" class="lang_icon">
                            <select id="language">
                                <option value="ja">日本語</option>
                                <option value="en">English</option>
                            </select>
                            <img src="images/down_arrow.svg" alt="言語を選択" class="language_arrow">
                        </div>
                    </div>
                </div>
            </div>

            <section class="favorite_area" id="favoriteArea">
                <h2 class="favorite_title" id="favoriteTitle">お気に入りの動物を追加</h2>
                <button type="button" class="favorite_add" id="favoriteAdd">
                    <img src="images/plus.svg" alt="お気に入りの動物を追加" class="favorite_add_icon">
                </button>
                <div class="favorite_registered" id="favoriteRegistered" hidden>
                    <div class="favorite_animal_image">
                        <img src="" alt="" id="favoriteAnimalImage">
                        <button type="button" class="animal_change" id="animalChange">
                            <img src="images/change.svg" alt="お気に入りの動物を変更">
                        </button>
                    </div>
                    <div class="affection_actions">
                        <button type="button" class="affection_action food_action" id="foodAction">
                            <img src="images/food.svg" alt="食べ物をあげる">
                        </button>
                        <button type="button" class="affection_action present_action" id="presentAction">
                            <img src="images/present.svg" alt="プレゼントをあげる">
                        </button>
                    </div>
                    <div class="affection_status">
                        <div class="affection_bar">
                            <div class="affection_bar_fill" id="affectionBarFill"></div>
                        </div>
                        <div class="affection_value">
                            <img src="images/heart.png" alt="好感度">
                            <span id="affectionValue">0</span>
                        </div>
                    </div>
                    <button type="button" class="reward_list_button" id="rewardOpen">報酬一覧</button>
                </div>
            </section>
            <div class="animal_select" id="animalSelect" hidden>
                <div class="animal_select_space"></div>

                <div class="search_area">
                    <div class="search_box">
                        <img src="images/search.svg" alt="検索マーク" class="search_icon">
                        <input type="search" name="animalKeyword" id="animalKeyword" placeholder="キーワードで検索">
                    </div>

                    <div class="sort_box">
                        <select name="animalSort" id="animalSort">
                            <option value="date">日付順</option>
                            <option value="name">名前順</option>
                            <option value="favor">好感度順</option>
                        </select>
                        <img src="images/pulldown.svg" alt="" class="pulldown_icon">
                    </div>
                </div>

                <div class="collection_list">
                    <button type="button" class="animal_card" data-name="ダンダン" data-image="images/profile_banban.png">
                        <div class="animal_image">
                            <img src="images/profile_banban.png" alt="ダンダン">
                            <div class="heart">
                                <img src="images/heart.png" alt="">
                                <span>0</span>
                            </div>
                        </div>
                        <div class="animal_info">
                            <h2>ダンダン</h2>
                            <div class="animal_data">
                                <div>
                                    <p>前回訪問日</p>
                                    <time datetime="2026-09-04">2026/09/04</time>
                                </div>
                                <div>
                                    <p>訪問回数</p>
                                    <span>1回</span>
                                </div>
                            </div>
                        </div>
                    </button>

                    <button type="button" class="animal_card" data-name="のりん" data-image="images/profile_norin.png">
                        <div class="animal_image">
                            <img src="images/profile_norin.png" alt="のりん">
                            <div class="heart">
                                <img src="images/heart.png" alt="">
                                <span>0</span>
                            </div>
                        </div>
                        <div class="animal_info">
                            <h2>のりん</h2>
                            <div class="animal_data">
                                <div>
                                    <p>前回訪問日</p>
                                    <time datetime="2026-09-03">2026/09/03</time>
                                </div>
                                <div>
                                    <p>訪問回数</p>
                                    <span>1回</span>
                                </div>
                            </div>
                        </div>
                    </button>

                    <button type="button" class="animal_card" data-name="さき" data-image="images/profile_saki.png">
                        <div class="animal_image">
                            <img src="images/profile_saki.png" alt="さき">
                            <div class="heart">
                                <img src="images/heart.png" alt="">
                                <span>0</span>
                            </div>
                        </div>
                        <div class="animal_info">
                            <h2>さき</h2>
                            <div class="animal_data">
                                <div>
                                    <p>前回訪問日</p>
                                    <time datetime="2026-09-02">2026/09/02</time>
                                </div>
                                <div>
                                    <p>訪問回数</p>
                                    <span>1回</span>
                                </div>
                            </div>
                        </div>
                    </button>

                    <button type="button" class="animal_card" data-name="コウ" data-image="images/profile_kou.png">
                        <div class="animal_image">
                            <img src="images/profile_kou.png" alt="コウ">
                            <div class="heart">
                                <img src="images/heart.png" alt="">
                                <span>1</span>
                            </div>
                        </div>
                        <div class="animal_info">
                            <h2>コウ</h2>
                            <div class="animal_data">
                                <div>
                                    <p>前回訪問日</p>
                                    <time datetime="2026-09-01">2026/09/01</time>
                                </div>
                                <div>
                                    <p>訪問回数</p>
                                    <span>1回</span>
                                </div>
                            </div>
                        </div>
                    </button>
                </div>

                <button type="button" class="animal_back" id="animalBack">
                    戻る
                </button>
            </div>
            <div class="animal_confirm" id="animalConfirm" hidden>
                <div class="animal_confirm_box">
                    <p class="confirm_animal_name" id="confirmAnimalName"></p>
                    <p class="confirm_text">を追加しますか？</p>
                    <div class="confirm_buttons">
                        <button type="button" class="confirm_no" id="confirmNo">いいえ</button>
                        <button type="button" class="confirm_yes" id="confirmYes">はい</button>
                    </div>
                </div>
            </div>
            <div class="reward_modal" id="rewardModal" hidden>
                <div class="reward_modal_box">
                    <ul class="reward_list">
                        <li class="reward_item">
                            <img src="images/heart1.png" alt="好感度1">
                            <p>デジタル写真</p>
                        </li>
                        <li class="reward_item">
                            <img src="images/heart2.png" alt="好感度2">
                            <p>動画</p>
                        </li>
                        <li class="reward_item">
                            <img src="images/heart3.png" alt="好感度3">
                            <p>グッズ引換券</p>
                        </li>
                        <li class="reward_item">
                            <img src="images/heart4.png" alt="好感度4">
                            <p>一回入館料20%OFF</p>
                        </li>
                        <li class="reward_item">
                            <img src="images/heartMAX.png" alt="好感度MAX">
                            <p>餌やり体験無料</p>
                        </li>
                    </ul>
                    <button type="button" class="reward_close" id="rewardClose">
                        <img src="images/cross_btn.png" alt="報酬一覧を閉じる">
                    </button>
                </div>
            </div>
        </main>
        <footer>
            <nav class="footer_nav">
                <div class="footer_item">
                    <a href="index.html">
                        <p><img src="images/map_icon.svg" alt=""></p>
                        <p>マップ</p>
                    </a>
                </div>
                <div class="footer_item">
                    <a href="item.html">
                        <p><img src="images/itembox_icon.svg" alt=""></p>
                        <p>アイテム</p>
                    </a>
                </div>
                <div class="footer_item">
                    <a href="collection.html">
                        <p><img src="images/collection_icon.svg" alt=""></p>
                        <p>コレクション</p>
                    </a>
                </div>
                <div class="footer_item">
                    <a href="news.html">
                        <p><img src="images/news_icon.svg" alt=""></p>
                        <p>お知らせ</p>
                    </a>
                </div>
            </nav>
        </footer>
    </div>
</body>

</html>
