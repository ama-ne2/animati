<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにまち</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/index.js"></script>

</head>

<body>
    <div class="main_content">
        <header>
            <div class="header_icons">
                <a href="mypage.html" class="icon_img">
                    <p><img src="images/mypage_icon.svg" alt="マイページに飛ぶアイコン"></p>
                </a>
                <a href="qrpage.html" class="qr_link">
                    <p><img src="images/qr_icon.svg" alt="QRコードを読み込むアイコン"></p>
                </a>
            </div>
        </header>
        <main>
            <div class="map_area">
                <img src="images/map.png" alt="地図" class="map_img">
                <button type="button" class="food_btn">
                    <span>+</span>
                </button>
                <button type="button" class="animal_btn">
                    <img src="/images/dandan_icon.png" alt="ダンダンの写真">
                </button>
            </div>
        </main>
        <footer>
            <nav class="footer_nav">
                <div class="footer_item">
                    <a href="index.html">
                        <p><img src="images/map_icon.svg" alt=""></p>
                        <p>マップ</p>
                    </a>
                </div>
                <div class="footer_item">
                    <a href="item.html">
                        <p><img src="images/itembox_icon.svg" alt=""></p>
                        <p>アイテム</p>
                    </a>
                </div>
                <div class="footer_item">
                    <a href="collection.html">
                        <p><img src="images/collection_icon.svg" alt=""></p>
                        <p>コレクション</p>
                    </a>
                </div>
                <div class="footer_item">
                    <a href="news.html">
                        <p><img src="images/news_icon.svg" alt=""></p>
                        <p>お知らせ</p>
                    </a>
                </div>
            </nav>
        </footer>
    </div>
    <div class="modal">
        <div class="madal backdrop" data-close-modal></div>
        <section class="profile_card">
            <img src="images/profile_banban.png" alt="パンダのダンダン" class="profile_img">
            <div class="profile_header">
                <h1>ダンダン</h1>
                <span class="material-icons">male</span>
                <span class="level">0</span>
            </div>
            <button class="zoo-link" type="button">
                ECC動物園
                <span class="material-icons">play_arrow</span>
            </button>

            <dl class="profile-details">
                <div>
                    <dt>性格</dt>
                    <dd>大人っぽい</dd>
                </div>
                <div>
                    <dt>特徴</dt>
                    <dd>お腹の黒い点</dd>
                </div>
            </dl>
        </section>
    </div>
</body>

</html>
